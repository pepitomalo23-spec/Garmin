name: Compilar esfera Garmin

# Compila la esfera en la nube (sin ordenador) y deja el paquete .iq en build/.
# Necesita dos secretos del repositorio: GARMIN_USERNAME y GARMIN_PASSWORD
# (tu cuenta Garmin; solo se usan para descargar los archivos de dispositivos del SDK).

on:
  push:
    branches: ["main"]
    paths-ignore: ["build/**"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: compilar-garmin
  cancel-in-progress: true

env:
  SDK_VERSION: "9.3.0"
  SDK_MANAGER_VERSION: "v0.8.4"

jobs:
  compilar:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Comprobar secretos
        env:
          GARMIN_USERNAME: ${{ secrets.GARMIN_USERNAME }}
          GARMIN_PASSWORD: ${{ secrets.GARMIN_PASSWORD }}
        run: |
          if [ -z "$GARMIN_USERNAME" ] || [ -z "$GARMIN_PASSWORD" ]; then
            echo "::error::Faltan los secretos GARMIN_USERNAME / GARMIN_PASSWORD (Settings > Secrets and variables > Actions)."
            exit 1
          fi

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: actions/setup-go@v5
        with:
          go-version: "stable"

      - name: Instalar gestor del SDK (CLI)
        run: |
          go install github.com/lindell/connect-iq-sdk-manager-cli@${SDK_MANAGER_VERSION}
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Licencia, login y descarga de SDK + dispositivos
        env:
          GARMIN_USERNAME: ${{ secrets.GARMIN_USERNAME }}
          GARMIN_PASSWORD: ${{ secrets.GARMIN_PASSWORD }}
        run: |
          connect-iq-sdk-manager-cli agreement accept
          connect-iq-sdk-manager-cli login
          connect-iq-sdk-manager-cli sdk set "${SDK_VERSION}"
          connect-iq-sdk-manager-cli device download --download-all
          echo "$(connect-iq-sdk-manager-cli sdk current-path --bin)" >> "$GITHUB_PATH"

      - name: Rellenar lista de relojes
        run: python3 scripts/fill_products.py manifest.xml

      - name: Compilar paquete .iq (todos los relojes)
        run: |
          mkdir -p build
          monkeyc -e -r -w -f monkey.jungle -y keys/developer_key.der -o build/PabloFace.iq
          ls -la build

      - name: Guardar el resultado en el repositorio
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add build/PabloFace.iq
          git commit -m "Build: PabloFace.iq ($(date -u +%Y-%m-%dT%H:%MZ))" || echo "Sin cambios"
          git push
