name: Compilar esfera Garmin

# Compila la esfera en la nube (sin ordenador) y deja en build/:
#   PabloFace.iq  -> paquete para subir a la tienda Connect IQ
#   log.txt       -> registro de la compilación (contraseña enmascarada)
# Secretos necesarios: GARMIN_USERNAME y GARMIN_PASSWORD.

on:
  push:
    branches: ["main"]
    paths-ignore: ["build/**"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: compilar-garmin
  cancel-in-progress: true

env:
  SDK_VERSION: "9.3.0"
  SDK_MANAGER_VERSION: "v0.8.4"

jobs:
  compilar:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: actions/setup-go@v5
        with:
          go-version: "stable"
          cache: false

      - name: Compilar
        env:
          GARMIN_USERNAME: ${{ secrets.GARMIN_USERNAME }}
          GARMIN_PASSWORD: ${{ secrets.GARMIN_PASSWORD }}
        run: |
          mkdir -p build
          if [ -z "$GARMIN_USERNAME" ] || [ -z "$GARMIN_PASSWORD" ]; then
            echo "ESTADO: FALLO - faltan los secretos GARMIN_USERNAME / GARMIN_PASSWORD" | tee build/log.txt
            exit 1
          fi
          bash scripts/build.sh

      - name: Guardar resultado y registro en el repositorio
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add -f build/ || true
          git commit -m "Build $(date -u +%Y-%m-%dT%H:%MZ): $(tail -n1 build/log.txt 2>/dev/null)" || echo "Sin cambios"
          git push
